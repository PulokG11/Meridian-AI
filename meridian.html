<section class="hero"><div><span class="eyebrow">Claim · denial · appeal · recovery</span><h1>One line from the encounter to the deposit.</h1><p class="lead">A meridian is a shared reference line. In Meridian AI the claim and its history are that line. The biller sees what was submitted, the appeals specialist sees what the payer disputed, and finance traces the payment back to the same service line.</p>
<div class="cta">${btn('Open the prototype','p lg','data-go="dashboard"')}${btn('Walk a denial through the loop','s2 lg','data-go="ws:Workqueues"')}</div><p class="muted" style="font-size:12.5px">All data is synthetic. Nothing here connects to a real EHR, payer or bank.</p></div>
<div class="diagram">${diagram()}<div class="cap"><span>CLM-23988 · line 2 · CPT 72158 · $3,050</span><span>Same service line, four systems</span></div></div></section></div>
<section class="band alt" id="how"><div class="wrap"><h2>Three people look at one claim and see three different things.</h2><p class="sub">Meridian puts their views on one history, so nobody re-keys a claim number to find out what happened to it.</p>
<div class="three"><div class="fact"><h3>Biller</h3><p>Sees what was submitted, which acknowledgments came back and what the payer received.</p><span class="mono">837P · 999 · 277CA</span></div><div class="fact"><h3>Appeals specialist</h3><p>Sees what the payer disputed, what the chart supports and what is still missing.</p><span class="mono">CARC / RARC · chart evidence</span></div><div class="fact"><h3>Finance</h3><p>Sees which deposit paid which service line, and what is left unallocated.</p><span class="mono">835 · EFT trace · DEP · ledger</span></div></div></div></section>
<section class="band"><div class="wrap"><h2>Four record types feed the claim history.</h2><p class="sub">The prototype models each one with synthetic records so a team can test the whole loop.</p>
<div class="three"><div class="fact"><h3>EHR encounter and coverage</h3><p>Orders, notes, diagnoses, rendering provider and the coverage on file.</p><span class="mono">ENC-77190 · A-4471-90</span></div><div class="fact"><h3>Outbound claims and acknowledgments</h3><p>Batches, file acknowledgments and claim acknowledgments from the clearinghouse.</p><span class="mono">B-5524 · 999 accepted</span></div><div class="fact"><h3>Inbound remittances</h3><p>835 lines with group codes, reason codes and remark codes per service line.</p><span class="mono">EFT-91407 · CO-50 / N115</span></div><div class="fact"><h3>Finance deposit allocations</h3><p>Bank deposits matched to remits and posted to the ledger.</p><span class="mono">DEP-88301 · GL batch</span></div></div></div></section>
<section class="band alt" id="out"><div class="wrap"><h2>AI compares the denial with the evidence, then recommends one of three outcomes.</h2><p class="sub">A person approves every action. Drafts that contain statements the chart does not support are blocked until someone fixes them.</p>
<div class="three"><div class="outcome">${bd('s','Correct the claim')}<h3>The data was wrong</h3><p class="sec">CO-16 with N290 means the rendering provider identifier is missing. Rebuild the claim as a replacement and send it.</p><span class="ex">Example: CLM-24033 · 93% confidence</span></div>
<div class="outcome">${bd('a','Request evidence')}<h3>The payer needs records</h3><p class="sec">CO-252 with M127 asks for the medical record. Assemble the packet, flag what is missing and send it before the deadline.</p><span class="ex">Example: CLM-24051 · 88% confidence</span></div>
<div class="outcome">${bd('w','Appeal')}<h3>The payer disputed necessity</h3><p class="sec">CO-50 with N115 is a coverage decision. Draft a letter where every statement points at a chart source.</p><span class="ex">Example: CLM-24017 · 86% confidence</span></div></div></div></section>
<section class="band"><div class="wrap"><h2>Measured on a fixed cohort, with each stage counted separately.</h2><p class="sub">Appeal approvals, payer overturns and cash receipts are three different numbers, so the team can see where recovery stalls.</p>
<div class="grid k4">${kpi('Median analyst minutes per resolved case','38','n','','target 30')}${kpi('Filing deadlines missed','6','d','','of 318 eligible')}${kpi('Unsupported statements per reviewed draft','0.13','w','','14 in 112 drafts')}${kpi('Reconciled cash per eligible denied dollar','$0.31','s','','Q2-26 cohort')}</div>
<div class="cta" style="display:flex;gap:10px;margin-top:24px;flex-wrap:wrap">${btn('See the analytics','s2','data-go="analytics"')}${btn('Browse 15 process workflows','s2','data-go="flows"')}</div></div></section>
<section class="band alt" id="scope"><div class="wrap"><h2>What this prototype covers.</h2><div class="scope" style="margin-top:20px"><div><h3>In the prototype</h3><ul><li>Dashboard, Workspace (nine tabs), Workflows, Users, Analytics and Settings</li><li>Five synthetic cases that run the full loop, including a corrected claim and an evidence request</li><li>Approval gate, unsupported-statement block and per-stage metrics</li></ul></div><div><h3>Left to implementation</h3><ul><li>Payer-specific filing rules and real timelines</li><li>Production integrations with the EHR, clearinghouse, payers and bank</li><li>Role permissions and approval limits (the values shown are examples)</li><li>Interaction polish and transitions</li></ul></div></div></div></section>

function line(vals,labels,o){const W=300,H=110,pl=34,pr=14,pt=10,pb=22,min=o.min,max=o.max;const X=i=>pl+i*(W-pl-pr)/(vals.length-1),Y=v=>pt+(1-(v-min)/(max-min))*(H-pt-pb);
 const pts=vals.map((v,i)=>[X(i),Y(v)]);const d='M'+pts.map(p=>p.map(n=>n.toFixed(1)).join(' ')).join(' L');const area=d+` L${X(vals.length-1)} ${H-pb} L${X(0)} ${H-pb} Z`;
 const ticks=[min,(min+max)/2,max].map(t=>`<line class="ax" x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl-5}" y="${Y(t)+4}" text-anchor="end">${o.fmt(t)}</text>`).join('');
 const lx=[0,Math.floor((vals.length-1)/2),vals.length-1].map(i=>`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':i===vals.length-1?'end':'middle'}">${labels[i]}</text>`).join('');
 const tg=o.target!=null?`<line class="tg" x1="${pl}" x2="${W-pr}" y1="${Y(o.target)}" y2="${Y(o.target)}"/><text x="${W-pr}" y="${Y(o.target)-4}" text-anchor="end" style="fill:var(--warn)">target ${o.fmt(o.target)}</text>`:'';
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.label}">${ticks}${tg}<path class="ar" d="${area}"/><path class="ln" d="${d}"/><circle class="ep" cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="4"/>${lx}</svg>`}
function bars(vals,labels,o){const W=300,H=110,pl=24,pr=8,pt=10,pb=22,max=o.max;const bw=(W-pl-pr)/vals.length*.62,st=(W-pl-pr)/vals.length;const Y=v=>pt+(1-v/max)*(H-pt-pb);
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.label}">${[0,max/2,max].map(t=>`<line class="ax" x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl-5}" y="${Y(t)+4}" text-anchor="end">${t}</text>`).join('')}${vals.map((v,i)=>`<rect x="${pl+i*st+(st-bw)/2}" y="${Y(v)}" width="${bw}" height="${H-pb-Y(v)}" rx="3" fill="var(--bad)" opacity=".85"/><text x="${pl+i*st+st/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>${v?`<text x="${pl+i*st+st/2}" y="${Y(v)-4}" text-anchor="middle" style="fill:var(--fg2)">${v}</text>`:''}`).join('')}</svg>`}
function pipe(l,v,max,sub,color){return `<div>${l}</div><div class="bar"><span style="width:${v/max*100}%;${color?'background:'+color:''}"></span></div><div class="num" style="font-size:12.5px">${sub}</div>`}

 <div style="display:grid;gap:16px;align-content:start">${card(f[0],'Owner: '+f[2]+' · Measured by: '+f[3],`<ol class="tl" style="margin:0">${f[4].map((s,i)=>`<li><span class="dot ${who[s[2]][0]==='a'?'a':who[s[2]][0]==='w'?'w':'n'}"></span><div><div class="t">${s[0]}</div><div class="s">${s[1]}</div></div>${bd(who[s[2]][0],who[s[2]][1])}</li>`).join('')}</ol><div class="flat"><b>Gate:</b> ${f[5]}</div><div>${btn('Open '+f[1]+' tab','p','data-go="ws:'+f[1]+'"')}</div>`)}</div></div>`)}
/* ====== state changes ====== */
function adv(id,to,msg){S.st[id]=to;toast(msg)}
const ACT={
cur:id=>{S.cur=id},
queue:n=>{S.sel=n},
draft:id=>{adv(id,2,'Meridian AI drafted the '+({appeal:'appeal',corrected:'corrected claim',evidence:'evidence packet',cob:'coverage update'})[CL[id].path]+'. Review it, then send to approval.')},
sendappr:id=>{if(id==='CLM-24017'&&!S.flagOk&&S.set.block){toast('Blocked: the draft has 1 unsupported statement.');return}S.pend[id]=true;toast('Sent to approval. A reviewer must approve it.')},
approve:id=>{const lim=S.role==='Manager'?10000:2500;if(CL[id].billed>lim){toast('Over the '+S.role+' limit. Switch to Manager.');return}S.pend[id]=false;S.st[id]=3;S.hist.unshift([id,PATH[CL[id].path][1]+' release',S.role]);S.selAppr=null;toast('Approved by '+S.role+'. Release it from the Submission tab.')},
ret:id=>{S.pend[id]=false;S.selAppr=null;toast('Returned to the author with a note.')},
wo:v=>{S.wo=false;if(v==='ok')S.hist.unshift(['WO-310','Write-off $610',S.role]);toast(v==='ok'?'Write-off approved and posted.':'Write-off returned.')},
release:id=>adv(id,4,'Released. Transaction built; 999 and 277CA accepted.'),
sim:id=>adv(id,5,'Simulated: payer responded. '+CL[id].det[5]+'.'),
post:id=>adv(id,6,'835 posted to the service lines.'),
alloc:id=>adv(id,7,'Allocated to '+CL[id].dep+'.'),
recon:id=>adv(id,8,'Reconciled. '+$m(CL[id].paid)+' traced from the service line to the ledger.'),
flag:m=>{S.flagOk=true;S.flagMode=m==='fix'?'fix':'remove';toast('Flag resolved. 0 unsupported statements.')},
sel:id=>{S.selAppr=id},
sw:k=>{if(k==='always'){toast('Human approval is always required in this prototype.');return}S.set[k]=!S.set[k]},
conf:d=>{S.set.conf=Math.max(50,Math.min(95,S.set.conf+Number(d)))},
stab:t=>{S.setTab=t},utab:t=>{S.uTab=t},flow:i=>{S.flow=Number(i)},
toastx:m=>{toast(m)},export:()=>toast('Exports are not part of this prototype.'),assign:()=>toast('Assignment is not part of this prototype.'),edits:()=>toast('Edits re-run: 12 of 12 passed.'),
ask:()=>{toast('Ask Meridian AI would open a case-aware assistant. Not built in this prototype.')},def:()=>{S.view='settings';S.setTab='Metric definitions'},
reset:()=>{S.st={'CLM-24017':2,'CLM-24033':1,'CLM-24051':1,'CLM-24068':1,'CLM-23988':8};S.pend={};S.flagOk=false;S.flagMode='';S.hist=[];S.wo=true;S.cur='CLM-24017';toast('Test bench reset.')},
invite:()=>{$('#modal').hidden=false;$('#modal').innerHTML=`<div class="box" role="dialog" aria-label="Invite user"><h3>Invite a user</h3><label class="f">Name<input id="in-n" value="Riley Morgan"></label><label class="f">Role<select id="in-r"><option>Billing specialist</option><option>Denials analyst</option><option>Appeals specialist</option><option>Cash poster</option><option>Finance analyst</option></select></label><div class="acts" style="justify-content:flex-end">${btn('Cancel','s2','data-act="close"')}${btn('Send invite','p','data-act="doinvite"')}</div></div>`;return 'keep'},
close:()=>{$('#modal').hidden=true;return 'keep'},
doinvite:()=>{S.invited.push([$('#in-n').value||'New user',$('#in-r').value,'Assigned by role','Suggest only','Invited']);$('#modal').hidden=true;toast('Invite recorded (synthetic). No email is sent.')},
scroll:id=>{const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth'});return 'keep'}
};
/* ====== routing ====== */
const TOK={landing:'landing',dashboard:'dashboard',flows:'workflows',users:'users',analytics:'analytics',settings:'app-settings'};
function render(){const v=S.view;let h;
 if(v==='landing')h=landing();else if(v==='dashboard')h=dashboard();else if(v.startsWith('ws:')){const t=v.slice(3);h=({Workqueues:wsWorkqueues,Submission:wsSubmission,Account:wsAccount,Claims:wsClaims,Remits:wsRemits,Report:wsReport,Appeals:wsAppeals,Coverage:wsCoverage,Approvals:wsApprovals})[t]()}
 else if(v==='flows')h=flows();else if(v==='users')h=users();else if(v==='analytics')h=analytics();else h=settings();
 $('#app').innerHTML=h;const sc=document.scrollingElement;}
function go(v,top){S.view=v;render();if(top!==false)window.scrollTo(0,0);try{const t=v.startsWith('ws:')?'ws-'+v.slice(3).toLowerCase():TOK[v];if(t)history.replaceState(null,'','#'+t)}catch(e){}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-act]');if(!el)return;
 if(el.dataset.go){const g=el.dataset.go;if(g.startsWith('case:')){const id=g.slice(5);S.cur=id;go('ws:'+(stg(id)>=8?'Report':tabFor(id)||'Account'))}else go(g);return}
 const [k,...r]=el.dataset.act.split(':');const f=ACT[k];if(!f)return;const keep=f(r.join(':'));if(keep==='keep')return;const y=window.scrollY;render();window.scrollTo(0,y)});
document.addEventListener('change',e=>{if(e.target.id==='role'){S.role=e.target.value;const y=window.scrollY;render();window.scrollTo(0,y)}});
document.addEventListener('keydown',e=>{if(e.target.id==='q'&&e.key==='Enter'){const v=e.target.value.trim().toUpperCase();const id=IDS.find(i=>i===v||i.endsWith(v));if(id){S.cur=id;go('ws:Account')}else toast('No claim matches “'+e.target.value+'”. Try CLM-24033.')}if(e.key==='Escape')$('#modal').hidden=true});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true});
(function(){let t=(location.hash||'').slice(1);const m={landing:'landing',dashboard:'dashboard',workflows:'flows',users:'users',analytics:'analytics','app-settings':'settings'};let v='landing';if(m[t])v=m[t];else if(t.startsWith('ws-')){const n=TABS.find(x=>x.toLowerCase()===t.slice(3));if(n)v='ws:'+n}S.view=v;render()})();
</script>
