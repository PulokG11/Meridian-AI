<style>

--ok:#46C486;--okTint:#10301F;--warn:#E5B152;--warnTint:#33270E;--bad:#F27D7D;--badTint:#3B1A1A;color-scheme:dark}}

<section class="hero"><div><span class="eyebrow">Claim · denial · appeal · recovery</span><h1>One line from the encounter to the deposit.</h1><p class="lead">A meridian is a shared reference line. In Meridian AI the claim and its history are that line. The biller sees what was submitted, the appeals specialist sees what the payer disputed, and finance traces the payment back to the same service line.</p>
<div class="cta">${btn('Open the prototype','p lg','data-go="dashboard"')}${btn('Walk a denial through the loop','s2 lg','data-go="ws:Workqueues"')}</div><p class="muted" style="font-size:12.5px">All data is synthetic. Nothing here connects to a real EHR, payer or bank.</p></div>
<div class="diagram">${diagram()}<div class="cap"><span>CLM-23988 · line 2 · CPT 72158 · $3,050</span><span>Same service line, four systems</span></div></div></section></div>
<section class="band alt" id="how"><div class="wrap"><h2>Three people look at one claim and see three different things.</h2><p class="sub">Meridian puts their views on one history, so nobody re-keys a claim number to find out what happened to it.</p>
<div class="three"><div class="fact"><h3>Biller</h3><p>Sees what was submitted, which acknowledgments came back and what the payer received.</p><span class="mono">837P · 999 · 277CA</span></div><div class="fact"><h3>Appeals specialist</h3><p>Sees what the payer disputed, what the chart supports and what is still missing.</p><span class="mono">CARC / RARC · chart evidence</span></div><div class="fact"><h3>Finance</h3><p>Sees which deposit paid which service line, and what is left unallocated.</p><span class="mono">835 · EFT trace · DEP · ledger</span></div></div></div></section>
<section class="band"><div class="wrap"><h2>Four record types feed the claim history.</h2><p class="sub">The prototype models each one with synthetic records so a team can test the whole loop.</p>
<div class="three"><div class="fact"><h3>EHR encounter and coverage</h3><p>Orders, notes, diagnoses, rendering provider and the coverage on file.</p><span class="mono">ENC-77190 · A-4471-90</span></div><div class="fact"><h3>Outbound claims and acknowledgments</h3><p>Batches, file acknowledgments and claim acknowledgments from the clearinghouse.</p><span class="mono">B-5524 · 999 accepted</span></div><div class="fact"><h3>Inbound remittances</h3><p>835 lines with group codes, reason codes and remark codes per service line.</p><span class="mono">EFT-91407 · CO-50 / N115</span></div><div class="fact"><h3>Finance deposit allocations</h3><p>Bank deposits matched to remits and posted to the ledger.</p><span class="mono">DEP-88301 · GL batch</span></div></div></div></section>
<section class="band alt" id="out"><div class="wrap"><h2>AI compares the denial with the evidence, then recommends one of three outcomes.</h2><p class="sub">A person approves every action. Drafts that contain statements the chart does not support are blocked until someone fixes them.</p>
<div class="three"><div class="outcome">${bd('s','Correct the claim')}<h3>The data was wrong</h3><p class="sec">CO-16 with N290 means the rendering provider identifier is missing. Rebuild the claim as a replacement and send it.</p><span class="ex">Example: CLM-24033 · 93% confidence</span></div>
<div class="outcome">${bd('a','Request evidence')}<h3>The payer needs records</h3><p class="sec">CO-252 with M127 asks for the medical record. Assemble the packet, flag what is missing and send it before the deadline.</p><span class="ex">Example: CLM-24051 · 88% confidence</span></div>
<div class="outcome">${bd('w','Appeal')}<h3>The payer disputed necessity</h3><p class="sec">CO-50 with N115 is a coverage decision. Draft a letter where every statement points at a chart source.</p><span class="ex">Example: CLM-24017 · 86% confidence</span></div></div></div></section>
<section class="band"><div class="wrap"><h2>Measured on a fixed cohort, with each stage counted separately.</h2><p class="sub">Appeal approvals, payer overturns and cash receipts are three different numbers, so the team can see where recovery stalls.</p>
<div class="grid k4">${kpi('Median analyst minutes per resolved case','38','n','','target 30')}${kpi('Filing deadlines missed','6','d','','of 318 eligible')}${kpi('Unsupported statements per reviewed draft','0.13','w','','14 in 112 drafts')}${kpi('Reconciled cash per eligible denied dollar','$0.31','s','','Q2-26 cohort')}</div>
<div class="cta" style="display:flex;gap:10px;margin-top:24px;flex-wrap:wrap">${btn('See the analytics','s2','data-go="analytics"')}${btn('Browse 15 process workflows','s2','data-go="flows"')}</div></div></section>
<section class="band alt" id="scope"><div class="wrap"><h2>What this prototype covers.</h2><div class="scope" style="margin-top:20px"><div><h3>In the prototype</h3><ul><li>Dashboard, task inbox, Workspace (eighteen tabs including triage, corrected-claim, evidence and appeal builders, deposits, ledger and closure), Workflows, Users, Analytics and Settings</li><li>Ten provider personas with permissions, approval limits and separation of duties</li><li>Five synthetic cases that run the full loop to a closed case, including a corrected claim, an evidence request and a payer takeback that reopens a case</li><li>Approval gate, unsupported-statement block and per-stage metrics</li></ul></div><div><h3>Left to implementation</h3><ul><li>Payer-specific filing rules and real timelines</li><li>Production integrations with the EHR, clearinghouse, payers and bank</li><li>Role permissions and approval limits (the values shown are examples)</li><li>Interaction polish and transitions</li></ul></div></div></div></section>
<div class="wrap"><div class="foot">Meridian AI is a working name and open to change. This is a clickable prototype with synthetic data. ${btn('Open the prototype','p sm','data-go="dashboard"')}</div></div></div>`}

release:id=>{if(!can('release'))return deny('release');adv(id,4,'Released. Transaction built; 999 and 277CA accepted.');lg(id,'Released to the payer; 999 and 277CA accepted',1)},
sim:id=>{adv(id,5,'Simulated: payer responded. '+CL[id].det[5]+'.');lg(id,'Payer decision: '+CL[id].det[5],1,'Payer simulator')},
post:id=>{if(!can('post'))return deny('post');adv(id,6,'835 posted to the service lines.');lg(id,'Posted the 835 to the service lines (H15)',3)},
alloc:id=>{if(!can('alloc'))return deny('alloc');adv(id,7,'Allocated to '+CL[id].dep+'.');lg(id,'Allocated to deposit '+CL[id].dep+' (H20)',2)},
recon:id=>{if(!can('recon'))return deny('recon');const k=CLS[id];adv(id,8,'Reconciled. '+$m(CL[id].paid)+' traced from the service line to the ledger.');lg(id,'Confirmed reconciliation',1);if(k.type==='writeoff'&&!S.wos[id]){S.wos[id]={id:'WO-'+(320+IDS.indexOf(id)),amt:k.adj,st:'pending'};lg(id,'Requested write-off '+S.wos[id].id+' for the '+$m(k.adj)+' variance',1,'System')}},
stm:a=>{if(!can('draft'))return deny('draft');const [k,i,f]=a.split(':'),L=S.stm[S.cur];
 if(k==='fix'){const fx=FACTS[Number((document.getElementById('fx-'+i)||{}).value||0)];L[i]={t:fx.t,src:fx.src};S.caught++;lg(S.cur,'Replaced an unsupported statement with sourced wording',2);toast('Replaced with sourced wording.')}
 if(k==='rm'){if(!L[i].src)S.caught++;L.splice(Number(i),1);lg(S.cur,'Removed a statement',1);toast('Statement removed.')}
 if(k==='add'){const fx=FACTS[Number((document.getElementById('fx-add')||{}).value||0)];L.push({t:fx.t,src:fx.src});lg(S.cur,'Added a sourced statement',1);toast('Sourced statement added.')}
 if(k==='free'){const v=((document.getElementById('free')||{}).value||'').trim();if(v.length<8){toast('Type at least a short sentence.');return 'keep'}L.push({t:v,src:''});lg(S.cur,'Added a statement without a source (flagged)',1);toast('Added. It is flagged until you replace it with sourced wording.')}},
sched:a=>{const [k,id]=a.split(':');if(k==='ask'){S.sched[id]='open';lg(id,'Asked scheduling for the prior authorization number',1);toast('Task created for scheduling.')}else{S.sched[id]='done';S.ev[id+':auth']='AUTH-77120';lg(id,'Scheduling provided authorization AUTH-77120',1,'Scheduler');toast('Scheduling replied: AUTH-77120.')}},
ar:a=>{if(!can('ar'))return deny('ar');const [k,id]=a.split(':'),r=AR0.find(x=>x[0]===id),res=ARRES[r[1]];S.ar[id]={res:res[0],esc:!!res[2]};lg(id,'276 status check: '+res[0],2);toast(res[0]+(res[2]?'. Follow-up task created.':'.'))},
dep:a=>{const [k,d,e,m]=a.split(':');
 if(k==='sel'){S.selDep=d;return}
 if(!can('alloc'))return deny('alloc');
 let rem=e,amt=Number(m);
 if(k==='man'){rem=(document.getElementById('dep-r')||{}).value;amt=Number(String((document.getElementById('dep-a')||{}).value||'').replace(/[$,]/g,''))}
 if(!(amt>0)){toast('Enter an amount greater than zero.');return 'keep'}
 if(amt>depLeft(d)+1e-9){toast('Blocked: allocations cannot exceed the deposit amount. '+$m(depLeft(d))+' is left.');return 'keep'}
 S.dep[d].push({rem,amt});lg(d,'Allocated '+$m(amt)+' of '+d+' to '+rem,2);toast(depLeft(d)>0?'Allocated. '+$m(depLeft(d))+' is still unapplied.':'Fully allocated. The break is cleared.')},
cls:a=>{const [k,id]=a.split(':');
 if(k==='stmt'){if(!can('pat'))return deny('pat');S.pat[id]='statement';lg(id,'Sent patient statement for '+$m(CLS[id].pt),2);toast('Statement sent (simulated).');return}
 if(k==='paid'){if(!can('pat'))return deny('pat');S.pat[id]='paid';lg(id,'Recorded patient payment '+$m(CLS[id].pt),2);toast('Patient payment recorded.');return}
 if(k==='close'){if(!can('close'))return deny('close');if(blockers(id).length){toast('Closure blocked: '+blockers(id)[0]+'.');return 'keep'}const reason=S.pat[id]==='paid'?'Patient paid':'Recovered after denial';S.closed[id]={reason};lg(id,'Closed the case: '+reason+' (H21 passed)',2);toast('Case closed: '+reason+'.');return}
 if(k==='take'){S.closed[id]=null;S.reopen[id]=500;lg(id,'Payer takeback of $500 reopened the case (trigger: recoupment)',1,'Payer simulator');toast('Reopened: payer recouped $500.');return}
 if(k==='acc'){S.recAcc[id]=S.reopen[id];S.reopen[id]=0;lg(id,'Accepted the recoupment and posted a reversal',2);toast('Recoupment posted. The case can close again.')}},
sw:k=>{if(k==='always'){toast('Human approval is always required in this prototype.');return}S.set[k]=!S.set[k]},
conf:d=>{S.set.conf=Math.max(50,Math.min(95,S.set.conf+Number(d)))},
stab:t=>{S.setTab=t},utab:t=>{S.uTab=t},flow:i=>{S.flow=Number(i)},
toastx:m=>{toast(m)},export:()=>toast('Exports are not part of this prototype.'),assign:()=>toast('Assignment is not part of this prototype.'),edits:()=>toast('Edits re-run: 12 of 12 passed.'),
ask:()=>{toast('Ask Meridian AI would open a case-aware assistant. Not built in this prototype.')},def:()=>{S.view='settings';S.setTab='Metric definitions'},
reset:()=>{const set=S.set;initRun();S.persona='tester';S.cur='CLM-24017';toast('Test bench reset.')},
invite:()=>{$('#modal').hidden=false;$('#modal').innerHTML=`<div class="box" role="dialog" aria-label="Invite user"><h3>Invite a user</h3><label class="f">Name<input id="in-n" value="Riley Morgan"></label><label class="f">Role<select id="in-r"><option>Billing specialist</option><option>Denials analyst</option><option>Appeals specialist</option><option>Cash poster</option><option>Finance analyst</option></select></label><div class="acts" style="justify-content:flex-end">${btn('Cancel','s2','data-act="close"')}${btn('Send invite','p','data-act="doinvite"')}</div></div>`;return 'keep'},
close:()=>{$('#modal').hidden=true;return 'keep'},
doinvite:()=>{S.invited.push([$('#in-n').value||'New user',$('#in-r').value,'Assigned by role','Suggest only','Invited']);$('#modal').hidden=true;toast('Invite recorded (synthetic). No email is sent.')},
scroll:id=>{const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth'});return 'keep'}
};
/* ====== routing ====== */
const slug=t=>t.toLowerCase().replace(/ /g,'-');
const TOK={landing:'landing',dashboard:'dashboard',inbox:'inbox',flows:'workflows',users:'users',analytics:'analytics',settings:'app-settings'};
const WS={Workqueues:wsWorkqueues,Submission:wsSubmission,Account:wsAccount,Claims:wsClaims,Remits:wsRemits,Report:wsReport,Appeals:wsAppeals,Coverage:wsCoverage,Approvals:wsApprovals,Triage:wsTriage,'Corrected claim':wsCorrected,'Evidence packet':wsEvidence,'Appeal builder':wsAppealB,'AR follow-up':wsAR,Deposits:wsDeposits,Ledger:wsLedger,Closure:wsClosure,Timeline:wsTimeline};
function render(){const v=S.view;let h;
 if(v==='landing')h=landing();else if(v==='dashboard')h=dashboard();else if(v==='inbox')h=inbox();else if(v.startsWith('ws:'))h=WS[v.slice(3)]();
 else if(v==='flows')h=flows();else if(v==='users')h=users();else if(v==='analytics')h=analytics();else h=settings();
 $('#app').innerHTML=h}
function go(v,top){S.view=v;render();if(top!==false)window.scrollTo(0,0);try{const t=v.startsWith('ws:')?'ws-'+slug(v.slice(3)):TOK[v];if(t)history.replaceState(null,'','#'+t)}catch(e){}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-act]');if(!el)return;
 if(el.dataset.go){const g=el.dataset.go;if(g.startsWith('case:')){const id=g.slice(5);S.cur=id;go('ws:'+(tabFor(id)||'Timeline'))}else go(g);return}
 const [k,...r]=el.dataset.act.split(':');const f=ACT[k];if(!f)return;const keep=f(r.join(':'));if(keep==='keep')return;if(S.view.startsWith('ws:')||S.view==='inbox'||true){const y=window.scrollY;render();window.scrollTo(0,y)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='role'){S.role=t.value;const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(t.id==='persona'){ACT.persona(t.value);const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(t.dataset&&t.dataset.in){const key=S.cur+':'+t.dataset.in;S.ev[key]=t.value.trim();lg(S.cur,'Edited '+(t.dataset.in==='npi'?'rendering NPI':'prior authorization number')+': '+(t.value.trim()||'blank'),1);const y=window.scrollY;render();window.scrollTo(0,y)}});
document.addEventListener('keydown',e=>{if(e.target.id==='q'&&e.key==='Enter'){const v=e.target.value.trim().toUpperCase();const id=IDS.find(i=>i===v||i.endsWith(v));if(id){S.cur=id;go('ws:Account')}else toast('No claim matches “'+e.target.value+'”. Try CLM-24033.')}if(e.key==='Escape')$('#modal').hidden=true});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true});
(function(){let t=(location.hash||'').slice(1);const m={landing:'landing',dashboard:'dashboard',inbox:'inbox',workflows:'flows',users:'users',analytics:'analytics','app-settings':'settings'};let v='landing';if(m[t])v=m[t];else if(t.startsWith('ws-')){const n=TABS.find(x=>slug(x)===t.slice(3));if(n)v='ws:'+n}S.view=v;render()})();
</script>
