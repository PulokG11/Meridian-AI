<title>Meridian AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: marketing landing page, then an app shell (sidebar + topbar + content) with nine workspace tabs.
   Palette: ink navy shell, signal blue for actions, teal reserved for AI, semantic ok/warn/bad. Type: IBM Plex Sans + Plex Mono for ids and codes. */
:root{
--bg:#F3F5F8;--surface:#FFFFFF;--sunken:#ECEFF4;--ink:#0F1B2D;--ink2:#1B2B42;--line:#DCE2EA;--line2:#C3CCD6;
--fg:#0F1B2D;--fg2:#475669;--fg3:#6B7A8E;--inv:#FFFFFF;--inv2:#A9B7C9;--onbrand:#FFFFFF;
--brand:#1F5FE0;--brandTint:#E8EFFE;--ai:#0E9F8E;--aiTint:#E3F6F3;--aiText:#0A6F63;--aiLine:#9FDDD4;
--ok:#1A7F4B;--okTint:#E1F4E9;--warn:#9A6414;--warnTint:#FFF1D2;--bad:#B93232;--badTint:#FCE5E5;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0A111D;--surface:#121C2E;--sunken:#182540;--ink:#060B14;--ink2:#14223A;--line:#24324B;--line2:#344560;
--fg:#E7EDF6;--fg2:#AAB8CC;--fg3:#8190A7;--inv:#F2F6FB;--inv2:#97A8BF;--onbrand:#08101D;
--brand:#6C97FF;--brandTint:#17284F;--ai:#2CC4B0;--aiTint:#0E2B29;--aiText:#62E2D1;--aiLine:#1F6B63;
--ok:#46C486;--okTint:#10301F;--warn:#E5B152;--warnTint:#33270E;--bad:#F27D7D;--badTint:#3B1A1A;color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0A111D;--surface:#121C2E;--sunken:#182540;--ink:#060B14;--ink2:#14223A;--line:#24324B;--line2:#344560;
--fg:#E7EDF6;--fg2:#AAB8CC;--fg3:#8190A7;--inv:#F2F6FB;--inv2:#97A8BF;--onbrand:#08101D;
--brand:#6C97FF;--brandTint:#17284F;--ai:#2CC4B0;--aiTint:#0E2B29;--aiText:#62E2D1;--aiLine:#1F6B63;
--ok:#46C486;--okTint:#10301F;--warn:#E5B152;--warnTint:#33270E;--bad:#F27D7D;--badTint:#3B1A1A;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);overflow-x:hidden}
h1,h2,h3,h4,p{margin:0}h1,h2,h3{text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}.muted{color:var(--fg3)}.sec{color:var(--fg2)}.num{font-variant-numeric:tabular-nums}
.bad{color:var(--bad)}.okc{color:var(--ok)}.warnc{color:var(--warn)}
/* badges and buttons */
.bd{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;line-height:18px}
.bd.n{background:var(--sunken);color:var(--fg2)}.bd.i{background:var(--brandTint);color:var(--brand)}.bd.s{background:var(--okTint);color:var(--ok)}
.bd.w{background:var(--warnTint);color:var(--warn)}.bd.d{background:var(--badTint);color:var(--bad)}.bd.a{background:var(--aiTint);color:var(--aiText)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid transparent;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;line-height:18px}
.btn.p{background:var(--brand);color:var(--onbrand)}.btn.s2{background:var(--surface);border-color:var(--line2)}.btn.g{color:var(--brand);padding:8px 6px}.btn.ai{background:var(--ai);color:#06201C}
.btn.sm{padding:5px 10px;font-size:12px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.lg{padding:12px 20px;font-size:15px;border-radius:10px}
/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:var(--inv);padding:18px 12px 18px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brandrow{display:flex;gap:10px;align-items:center;padding:2px 8px 18px;cursor:pointer}
.mark{width:30px;height:30px;border-radius:8px;background:var(--ai);display:grid;place-items:center;flex:none}
.brandrow b{display:block;font-size:15px;color:var(--inv)}.brandrow small{color:var(--inv2);font-size:11.5px}
.nav{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;color:var(--inv2);font-weight:500;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.nav i{width:8px;height:8px;border-radius:3px;background:var(--inv2);opacity:.6;flex:none}
.nav:hover{background:var(--ink2);color:var(--inv)}.nav.on{background:var(--ink2);color:var(--inv)}.nav.on i{background:var(--ai);opacity:1}
.side .grow{flex:1}
.aibox{background:var(--ink2);border-radius:10px;padding:12px;font-size:12px;color:var(--inv2)}.aibox b{display:block;color:var(--inv);font-size:12.5px;margin-bottom:2px}
.me{display:flex;gap:10px;align-items:center;padding:12px 8px 0}.me b{font-size:13px;display:block;color:var(--inv)}.me small{color:var(--inv2);font-size:12px}
.av{width:30px;height:30px;border-radius:99px;background:var(--brandTint);color:var(--brand);font-weight:600;font-size:12px;display:grid;place-items:center;flex:none}
.main{min-width:0}
.top{display:flex;gap:12px;align-items:center;padding:12px var(--gr) 12px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.search{flex:1 1 260px;max-width:440px}.search input{width:100%;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--sunken);color:var(--fg);font:inherit}
.pill{border:1px solid var(--line2);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--fg2);white-space:nowrap}
.content{padding:26px var(--gr) 56px 28px;max-width:1260px;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}.ph h1{font-size:27px;line-height:1.2}.ph p{color:var(--fg2);margin-top:4px}.acts{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:thin}
.tab{padding:7px 14px;border-radius:8px;border:0;background:none;color:var(--fg2);font-weight:500;cursor:pointer;white-space:nowrap}.tab:hover{background:var(--sunken)}.tab.on{background:var(--brand);color:var(--onbrand)}
.casebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.casebar .lbl{font-size:12px;color:var(--fg3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center}.chip.on{border-color:var(--brand);background:var(--brandTint);color:var(--brand)}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card>header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.card h3{font-size:15px}.card header p{color:var(--fg3);font-size:12.5px;margin-top:2px}
.flat{background:var(--sunken);border-radius:10px;padding:12px}
.aip{background:var(--aiTint);border:1px solid var(--aiLine);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.aip h4{font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.aip ul{margin:0;padding-left:18px;color:var(--fg2);font-size:13px;display:flex;flex-direction:column;gap:4px}
.grid{display:grid;gap:16px}.k4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.k3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.k2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.c12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}.c11{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:980px){.c21,.c12,.c11{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:5px}.kpi .l{font-size:12.5px;font-weight:500;color:var(--fg2)}.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}.kpi .d{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--fg3)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--sunken);text-align:left;font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);padding:9px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}td.r,th.r{text-align:right}tr.click{cursor:pointer}tr.click:hover{background:var(--sunken)}tr.hl{background:var(--brandTint)}td a,.lnk{color:var(--brand);font-weight:500}
.kv{display:grid;grid-template-columns:116px minmax(0,1fr);gap:7px 12px;font-size:13px}.kv dt{color:var(--fg3)}.kv dd{margin:0;font-weight:500}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}.list li{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.ck{width:18px;height:18px;border-radius:99px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}.ck.y{background:var(--okTint);color:var(--ok)}.ck.n{background:var(--badTint);color:var(--bad)}.ck.w{background:var(--warnTint);color:var(--warn)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;position:relative;padding-bottom:16px}
.tl li::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}.tl li:last-child::before{display:none}.tl li:last-child{padding-bottom:0}
.tl .dot{width:14px;height:14px;border-radius:99px;border:3px solid var(--surface);margin-top:3px;position:relative;z-index:1}.tl .t{font-weight:500}.tl .s{font-size:12.5px;color:var(--fg3)}.tl .dt{font-size:12px;color:var(--fg3);white-space:nowrap;font-family:var(--mono)}
.dot.s{background:var(--ok)}.dot.d{background:var(--bad)}.dot.w{background:var(--warn)}.dot.i{background:var(--brand)}.dot.a{background:var(--ai)}.dot.n{background:var(--line2)}.dot.f{background:var(--surface);border-color:var(--line2);outline:0}
.ladder{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(9,minmax(70px,1fr));gap:0;overflow-x:auto}
.ladder li{position:relative;padding-top:18px;font-size:11.5px;color:var(--fg3);text-align:center;font-weight:500}
.ladder li i{position:absolute;top:0;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:99px;background:var(--line2);z-index:1}
.ladder li::before{content:"";position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--line2)}.ladder li:first-child::before{display:none}
.ladder li.done i,.ladder li.done::before,.ladder li.now::before{background:var(--ok)}.ladder li.done{color:var(--fg2)}.ladder li.now i{background:var(--brand);box-shadow:0 0 0 4px var(--brandTint)}.ladder li.now{color:var(--fg);font-weight:600}
.ladder.sm li{font-size:0;padding-top:12px}.ladder.sm li i{width:9px;height:9px;margin-left:-4.5px}.ladder.sm li::before{top:3.5px}
.next{border:1px solid var(--brand);background:var(--brandTint);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.next b{display:block}.next span{font-size:12.5px;color:var(--fg2)}
.next.done{border-color:var(--ok);background:var(--okTint)}
.hl-bad{background:var(--badTint);border-radius:4px;padding:1px 3px;border-bottom:2px solid var(--bad)}.hl-ok{background:var(--okTint);border-radius:4px;padding:1px 3px}
.letter{font-size:13.5px;line-height:1.7;display:flex;flex-direction:column;gap:10px}.src{font-family:var(--mono);font-size:11px;color:var(--aiText);background:var(--aiTint);border-radius:4px;padding:0 5px;white-space:nowrap}
.opt{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:5px;background:var(--surface)}.opt.sel{border:2px solid var(--ai);padding:11px;background:var(--aiTint)}.opt h4{font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.opt p{font-size:12.5px;color:var(--fg2)}
.trace{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));overflow-x:auto;gap:0}.trace>div{padding:10px 10px 0;position:relative;text-align:center}.trace>div::before{content:"";position:absolute;top:19px;left:-50%;width:100%;height:2px;background:var(--line2)}.trace>div:first-child::before{display:none}
.trace i{display:block;width:18px;height:18px;border-radius:99px;margin:0 auto 8px;background:var(--surface);border:2px solid var(--line2);position:relative;z-index:1}.trace .y i{background:var(--ai);border-color:var(--ai)}.trace .y::before{background:var(--ai)}.trace b{display:block;font-size:12.5px}.trace small{display:block;color:var(--fg3);font-size:11.5px;font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--inv);padding:11px 18px;border-radius:10px;font-size:13px;z-index:50;max-width:min(92vw,520px);box-shadow:0 8px 28px rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;background:rgba(6,11,20,.55);display:grid;place-items:center;z-index:40;padding:16px}.modal .box{background:var(--surface);border-radius:14px;padding:22px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--fg2)}.f input,.f select,.f textarea{padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit}
.sw{display:inline-block;width:36px;height:20px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;flex:none;border:0;padding:0}.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:99px;background:#fff;transition:left .15s}.sw.on{background:var(--ai)}.sw.on::after{left:18px}
.setrow{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.setrow:first-of-type{border-top:0}.setrow p{font-size:12.5px;color:var(--fg3)}
.ch text,.ch .tx{fill:var(--fg3);font:11px var(--sans)}.ch .ax{stroke:var(--line);stroke-width:1}.ch .ln{fill:none;stroke:var(--brand);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.ch .ar{fill:var(--brand);opacity:.12}.ch .tg{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:4 3}.ch .ep{fill:var(--brand)}
.bar{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden}.bar>span{display:block;height:100%;border-radius:5px;background:var(--brand)}
.pipe{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) 150px;gap:8px 14px;align-items:center;font-size:13px}
/* landing */
.lp{display:block}.wrap{max-width:1160px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.lnav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px;flex-wrap:wrap}.lnav .brandrow{padding:0}.lnav .brandrow b{color:var(--fg)}.lnav .brandrow small{color:var(--fg3)}
.lnav nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.lnav nav a{color:var(--fg2);font-weight:500;padding:8px 10px;text-decoration:none;cursor:pointer}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:center;padding-block:36px 56px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--aiText)}
.hero h1{font-size:clamp(34px,5.4vw,58px);line-height:1.04;font-weight:700;letter-spacing:-.03em;margin:14px 0 18px}
.hero p.lead{font-size:18px;line-height:1.55;color:var(--fg2);max-width:34em}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 14px}
.diagram{background:var(--ink);border-radius:16px;padding:18px;color:var(--inv)}.diagram svg{display:block;width:100%;height:auto}.diagram .cap{font-size:12px;color:var(--inv2);margin-top:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.band{padding-block:56px;border-top:1px solid var(--line)}.band.alt{background:var(--surface)}.band h2{font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin-bottom:10px;max-width:22em}.band .sub{font-size:16px;color:var(--fg2);max-width:42em;margin-bottom:28px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.fact{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:2px solid var(--ink)}.fact h3{font-size:17px}.fact p{color:var(--fg2)}.fact .mono{color:var(--fg3)}
.outcome{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}.band.alt .outcome{background:var(--bg)}.outcome h3{font-size:18px}.outcome .ex{font-size:12.5px;color:var(--fg3)}
.foot{padding-block:36px;color:var(--fg3);font-size:13px;border-top:1px solid var(--line)}
.scope{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}.scope ul{margin:8px 0 0;padding-left:18px;color:var(--fg2);display:flex;flex-direction:column;gap:5px}
@media (max-width:900px){
.app{grid-template-columns:minmax(0,1fr)}.side{position:static;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:10px var(--gr) 10px var(--gl);gap:4px;align-items:center}
.side .brandrow{padding:0 8px 0 0}.side .brandrow small,.side .grow,.side .aibox,.side .me{display:none}.nav{width:auto;white-space:nowrap;flex:none}
.top{padding:12px var(--gr) 12px var(--gl);position:static}.content{padding:20px var(--gr) 48px var(--gl)}.pipe{grid-template-columns:minmax(0,1fr)}}
.tabsep{width:1px;background:var(--line2);margin:4px 6px;flex:none}
.in{padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;max-width:100%}
.actas{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--fg3);font-weight:500}.actas select{padding:6px 8px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font:inherit;max-width:230px}
textarea.in,.f textarea{resize:vertical}
.navh{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--inv2);opacity:.75;padding:12px 12px 3px}
.mebtn{background:none;border:0;color:inherit;width:100%;cursor:pointer;border-radius:8px}.mebtn:hover{background:var(--ink2)}
.rolechip{display:inline-flex;gap:8px;align-items:center;background:var(--surface);cursor:pointer}
.rg{margin:0 0 26px}.rg h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);margin-bottom:10px}.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rc{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;cursor:pointer}.rc:hover{border-color:var(--brand)}.rc.cur{border:2px solid var(--brand);padding:13px}.rc b{font-size:15px}.rcs{font-size:12.5px;color:var(--aiText);font-weight:500}.rcd{font-size:13px;color:var(--fg2);margin-top:2px}.rcm{font-size:12px;color:var(--fg3);margin-top:6px}
@media (max-width:900px){.navh{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<section class="hero"><div><span class="eyebrow">Claim · denial · appeal · recovery</span><h1>One line from the encounter to the deposit.</h1><p class="lead">A meridian is a shared reference line. In Meridian AI the claim and its history are that line. The biller sees what was submitted, the appeals specialist sees what the payer disputed, and finance traces the payment back to the same service line.</p>
<div class="cta">${btn('Open the prototype','p lg','data-go="roles"')}${btn('Walk a denial through the loop','s2 lg','data-go="ws:Workqueues"')}</div><p class="muted" style="font-size:12.5px">All data is synthetic. Nothing here connects to a real EHR, payer or bank.</p></div>
<div class="diagram">${diagram()}<div class="cap"><span>CLM-23988 · line 2 · CPT 72158 · $3,050</span><span>Same service line, four systems</span></div></div></section></div>
<section class="band alt" id="how"><div class="wrap"><h2>Three people look at one claim and see three different things.</h2><p class="sub">Meridian puts their views on one history, so nobody re-keys a claim number to find out what happened to it.</p>
<div class="three"><div class="fact"><h3>Biller</h3><p>Sees what was submitted, which acknowledgments came back and what the payer received.</p><span class="mono">837P · 999 · 277CA</span></div><div class="fact"><h3>Appeals specialist</h3><p>Sees what the payer disputed, what the chart supports and what is still missing.</p><span class="mono">CARC / RARC · chart evidence</span></div><div class="fact"><h3>Finance</h3><p>Sees which deposit paid which service line, and what is left unallocated.</p><span class="mono">835 · EFT trace · DEP · ledger</span></div></div></div></section>
<section class="band"><div class="wrap"><h2>Four record types feed the claim history.</h2><p class="sub">The prototype models each one with synthetic records so a team can test the whole loop.</p>
<div class="three"><div class="fact"><h3>EHR encounter and coverage</h3><p>Orders, notes, diagnoses, rendering provider and the coverage on file.</p><span class="mono">ENC-77190 · A-4471-90</span></div><div class="fact"><h3>Outbound claims and acknowledgments</h3><p>Batches, file acknowledgments and claim acknowledgments from the clearinghouse.</p><span class="mono">B-5524 · 999 accepted</span></div><div class="fact"><h3>Inbound remittances</h3><p>835 lines with group codes, reason codes and remark codes per service line.</p><span class="mono">EFT-91407 · CO-50 / N115</span></div><div class="fact"><h3>Finance deposit allocations</h3><p>Bank deposits matched to remits and posted to the ledger.</p><span class="mono">DEP-88301 · GL batch</span></div></div></div></section>
<section class="band alt" id="out"><div class="wrap"><h2>AI compares the denial with the evidence, then recommends one of three outcomes.</h2><p class="sub">A person approves every action. Drafts that contain statements the chart does not support are blocked until someone fixes them.</p>
<div class="three"><div class="outcome">${bd('s','Correct the claim')}<h3>The data was wrong</h3><p class="sec">CO-16 with N290 means the rendering provider identifier is missing. Rebuild the claim as a replacement and send it.</p><span class="ex">Example: CLM-24033 · 93% confidence</span></div>
<div class="outcome">${bd('a','Request evidence')}<h3>The payer needs records</h3><p class="sec">CO-252 with M127 asks for the medical record. Assemble the packet, flag what is missing and send it before the deadline.</p><span class="ex">Example: CLM-24051 · 88% confidence</span></div>
<div class="outcome">${bd('w','Appeal')}<h3>The payer disputed necessity</h3><p class="sec">CO-50 with N115 is a coverage decision. Draft a letter where every statement points at a chart source.</p><span class="ex">Example: CLM-24017 · 86% confidence</span></div></div></div></section>
<section class="band"><div class="wrap"><h2>Measured on a fixed cohort, with each stage counted separately.</h2><p class="sub">Appeal approvals, payer overturns and cash receipts are three different numbers, so the team can see where recovery stalls.</p>
<div class="grid k4">${kpi('Median analyst minutes per resolved case','38','n','','target 30')}${kpi('Filing deadlines missed','6','d','','of 318 eligible')}${kpi('Unsupported statements per reviewed draft','0.13','w','','14 in 112 drafts')}${kpi('Reconciled cash per eligible denied dollar','$0.31','s','','Q2-26 cohort')}</div>
<div class="cta" style="display:flex;gap:10px;margin-top:24px;flex-wrap:wrap">${btn('See the analytics','s2','data-go="analytics"')}${btn('Browse 15 process workflows','s2','data-go="flows"')}</div></div></section>
<section class="band alt" id="scope"><div class="wrap"><h2>What this prototype covers.</h2><div class="scope" style="margin-top:20px"><div><h3>In the prototype</h3><ul><li>Dashboard, task inbox, eight sections of 4 to 9 tabs each across the three loops, Workflows, Users, Analytics and Settings</li><li>Access (14 tabs) and Clinical revenue (11 tabs): five visits from first call to a released claim, with authorization, estimate, clearance, coding, holds and enrollment gates</li><li>Finance (6 tabs) and Recovery additions (Underpayments, Audits, Disputes): patient accounts, assistance, plans, refunds, write-offs, compliance sampling and the prevention loop</li><li>Twenty-eight provider personas with permissions, approval limits and separation of duties</li><li>Five synthetic cases that run the full loop to a closed case, including a corrected claim, an evidence request and a payer takeback that reopens a case</li><li>Approval gate, unsupported-statement block and per-stage metrics</li></ul></div><div><h3>Left to implementation</h3><ul><li>Payer-specific filing rules and real timelines</li><li>Production integrations with the EHR, clearinghouse, payers and bank</li><li>Role permissions and approval limits (the values shown are examples)</li><li>Interaction polish and transitions</li></ul></div></div></div></section>
<div class="wrap"><div class="foot">Meridian AI is a working name and open to change. This is a clickable prototype with synthetic data. ${btn('Open the prototype','p sm','data-go="roles"')}</div></div></div>`}

function line(vals,labels,o){const W=300,H=110,pl=34,pr=14,pt=10,pb=22,min=o.min,max=o.max;const X=i=>pl+i*(W-pl-pr)/(vals.length-1),Y=v=>pt+(1-(v-min)/(max-min))*(H-pt-pb);
 const pts=vals.map((v,i)=>[X(i),Y(v)]);const d='M'+pts.map(p=>p.map(n=>n.toFixed(1)).join(' ')).join(' L');const area=d+` L${X(vals.length-1)} ${H-pb} L${X(0)} ${H-pb} Z`;
 const ticks=[min,(min+max)/2,max].map(t=>`<line class="ax" x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl-5}" y="${Y(t)+4}" text-anchor="end">${o.fmt(t)}</text>`).join('');
 const lx=[0,Math.floor((vals.length-1)/2),vals.length-1].map(i=>`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':i===vals.length-1?'end':'middle'}">${labels[i]}</text>`).join('');
 const tg=o.target!=null?`<line class="tg" x1="${pl}" x2="${W-pr}" y1="${Y(o.target)}" y2="${Y(o.target)}"/><text x="${W-pr}" y="${Y(o.target)-4}" text-anchor="end" style="fill:var(--warn)">target ${o.fmt(o.target)}</text>`:'';
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.label}">${ticks}${tg}<path class="ar" d="${area}"/><path class="ln" d="${d}"/><circle class="ep" cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="4"/>${lx}</svg>`}
function bars(vals,labels,o){const W=300,H=110,pl=24,pr=8,pt=10,pb=22,max=o.max;const bw=(W-pl-pr)/vals.length*.62,st=(W-pl-pr)/vals.length;const Y=v=>pt+(1-v/max)*(H-pt-pb);
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.label}">${[0,max/2,max].map(t=>`<line class="ax" x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl-5}" y="${Y(t)+4}" text-anchor="end">${t}</text>`).join('')}${vals.map((v,i)=>`<rect x="${pl+i*st+(st-bw)/2}" y="${Y(v)}" width="${bw}" height="${H-pb-Y(v)}" rx="3" fill="var(--bad)" opacity=".85"/><text x="${pl+i*st+st/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>${v?`<text x="${pl+i*st+st/2}" y="${Y(v)-4}" text-anchor="middle" style="fill:var(--fg2)">${v}</text>`:''}`).join('')}</svg>`}
function pipe(l,v,max,sub,color){return `<div>${l}</div><div class="bar"><span style="width:${v/max*100}%;${color?'background:'+color:''}"></span></div><div class="num" style="font-size:12.5px">${sub}</div>`}
